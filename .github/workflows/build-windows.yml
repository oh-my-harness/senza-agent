name: Release desktop installer

on:
  push:
    tags:
      - "v*"            # e.g. v0.1.0 → builds installer and creates a draft GitHub Release
  workflow_dispatch:     # manual run → build artifact only, no release

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="v$(node -p "require('./desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${pkg_version}" ]]; then
            echo "::error title=Version mismatch::tag ${GITHUB_REF_NAME} != desktop/package.json ${pkg_version}"
            exit 1
          fi

      # Tag builds: electron-builder publishes natively to a draft GitHub Release
      # (installer exe + .blockmap + latest.yml). Manual builds: artifact only.
      - name: Build NSIS installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'onTag' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenzaAgent-windows-x64-setup
          path: desktop/dist/SenzaAgent-Setup-*.exe
          if-no-files-found: error

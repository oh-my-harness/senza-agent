name: Release desktop installer

on:
  push:
    tags:
      - "v*"            # e.g. v0.1.0 → publishes SenzaAgent-Setup-<version>.exe to GitHub Releases
  workflow_dispatch:     # manual run → artifact only, no release

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="v$(node -p "require('./desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${pkg_version}" ]]; then
            echo "::error title=Version mismatch::tag ${GITHUB_REF_NAME} != desktop/package.json ${pkg_version}"
            exit 1
          fi

      - name: Build NSIS installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
        env:
          # keep electron-builder from auto-publishing; release upload is done below
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename release asset
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "desktop/dist/SenzaAgent-Setup-$version.exe" "release-assets/SenzaAgent-v$version-windows-x64-setup.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenzaAgent-windows-x64-setup
          path: release-assets/*
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
